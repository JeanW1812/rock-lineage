<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock Lineage — 搖滾脈絡圖</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Anton&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080808;
  --surface:#0f0f0f;
  --surface2:#161616;
  --surface3:#1c1c1c;
  --border:#222;
  --border2:#2e2e2e;
  --accent:#d4a843;
  --accent2:#f0c060;
  --red:#b83030;
  --red2:#d44040;
  --green:#3a8a55;
  --blue:#3a5fa0;
  --purple:#7a55b0;
  --text:#ddd8cc;
  --text2:#aaa49a;
  --muted:#666260;
  --muted2:#333;
  --font-d:'Anton',sans-serif;
  --font-db:'Bebas Neue',sans-serif;
  --font-m:'IBM Plex Mono',monospace;
  --font-b:'IBM Plex Sans',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:var(--font-b);display:flex;flex-direction:column;}

/* ── NOISE OVERLAY ── */
body::before{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  opacity:0.025;pointer-events:none;z-index:1000;
}

/* ── HEADER ── */
header{
  flex-shrink:0;
  padding:0 1.5rem;
  border-bottom:1px solid var(--border2);
  display:flex;align-items:stretch;gap:1.5rem;
  background:var(--surface);
  height:56px;
  position:relative;
}
header::after{
  content:'';position:absolute;bottom:-3px;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--red) 0%,var(--accent) 40%,var(--red) 100%);
}
.header-brand{display:flex;align-items:center;gap:1rem;}
h1{
  font-family:var(--font-d);
  font-size:2.2rem;
  letter-spacing:.08em;
  line-height:1;
  color:#fff;
  white-space:nowrap;
}
.header-rule{
  width:1px;background:var(--border2);flex-shrink:0;
  align-self:stretch;margin:10px 0;
}
.header-sub{
  font-family:var(--font-m);
  font-size:.52rem;
  color:var(--muted);
  letter-spacing:.12em;
  line-height:1.8;
  text-transform:uppercase;
}
.view-toggle{margin-left:auto;display:flex;gap:0;align-items:center;}
.vt-btn{
  font-family:var(--font-m);
  font-size:.58rem;
  letter-spacing:.1em;
  text-transform:uppercase;
  padding:.35rem 1rem;
  border:1px solid var(--border2);
  border-right:none;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  transition:all .15s;
  white-space:nowrap;
  height:32px;
}
.vt-btn:last-child{border-right:1px solid var(--border2);}
.vt-btn:hover{color:var(--text);background:var(--surface2);}
.vt-btn.active{
  border-color:var(--accent);
  color:var(--accent);
  background:rgba(212,168,67,.08);
  z-index:1;position:relative;
}

/* ── GENRE BAR ── */
.genre-bar{
  flex-shrink:0;
  display:flex;gap:.3rem;
  padding:.5rem 1.5rem;
  border-bottom:1px solid var(--border);
  overflow-x:auto;
  scrollbar-width:none;
  background:var(--surface);
  align-items:center;
}
.genre-bar::-webkit-scrollbar{display:none;}
.genre-label{
  font-family:var(--font-m);font-size:.5rem;
  color:var(--muted);letter-spacing:.12em;text-transform:uppercase;
  margin-right:.4rem;white-space:nowrap;flex-shrink:0;
}
.gp{
  font-family:var(--font-m);
  font-size:.54rem;
  letter-spacing:.08em;
  text-transform:uppercase;
  padding:.22rem .65rem;
  border:1px solid var(--border2);
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  white-space:nowrap;
  transition:all .15s;
}
.gp:hover{color:var(--text);border-color:var(--border2);background:var(--surface2);}
.gp.active{
  border-color:var(--accent);
  color:var(--accent);
  background:rgba(212,168,67,.06);
}

/* ── VIEWS ── */
.view{display:none;flex:1;overflow:hidden;}
.view.active{display:flex;}

/* ── TIMELINE VIEW ── */
#view-timeline{display:none;}
#view-timeline.active{display:grid;grid-template-columns:1fr 380px;}
.tl-scroll{
  overflow-y:auto;overflow-x:hidden;
  scrollbar-width:thin;scrollbar-color:var(--border2) transparent;
  border-right:1px solid var(--border2);
}

/* decade headers */
.decade-block{}
.yr-label{
  font-family:var(--font-d);
  font-size:4rem;
  color:transparent;
  -webkit-text-stroke:1px var(--border2);
  position:sticky;top:0;
  background:var(--bg);
  padding:.2rem 1.5rem .1rem;
  z-index:10;
  border-bottom:1px solid var(--border);
  letter-spacing:.04em;
  line-height:1;
  display:flex;
  align-items:baseline;
  gap:.5rem;
}
.yr-label-inner{position:relative;}
.yr-label-count{
  font-family:var(--font-m);font-size:.55rem;
  color:var(--muted);letter-spacing:.1em;
  -webkit-text-stroke:0;color:var(--muted);
}

/* band rows */
.band-row{
  display:flex;align-items:center;gap:.75rem;
  padding:.75rem 1.5rem;
  cursor:pointer;
  border-bottom:1px solid var(--border);
  transition:background .1s;
  position:relative;
}
.band-row::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
  background:transparent;transition:background .12s;
}
.band-row:hover{background:var(--surface);}
.band-row:hover::before{background:var(--border2);}
.band-row.selected{background:var(--surface2);}
.band-row.selected::before{background:var(--accent);}

.b-num{
  font-family:var(--font-m);font-size:.55rem;
  color:var(--muted);width:1.5rem;text-align:right;flex-shrink:0;
  letter-spacing:.05em;
}
.b-thumb{
  width:36px;height:36px;flex-shrink:0;
  background:var(--surface2);border:1px solid var(--border2);
  overflow:hidden;position:relative;
}
.b-thumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .3s;}
.b-thumb img.loaded{opacity:1;}
.b-thumb-ph{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-d);font-size:.8rem;color:var(--muted);
  letter-spacing:.04em;
}
.band-row.selected .b-thumb{border-color:var(--accent);}
.b-dot{
  width:6px;height:6px;border-radius:50%;flex-shrink:0;
  border:1px solid var(--muted);transition:all .12s;display:none;
}
.band-row.selected .b-dot,.band-row:hover .b-dot{
  border-color:var(--accent);background:var(--accent);
}

/* detail cover */
.d-cover{
  width:100%;aspect-ratio:16/7;
  background:var(--surface2);
  overflow:hidden;position:relative;
  border-bottom:1px solid var(--border2);
}
.d-cover img{
  width:100%;height:100%;object-fit:cover;
  display:block;opacity:0;transition:opacity .5s;
  filter:brightness(0.7) contrast(1.1) saturate(0.85);
}
.d-cover img.loaded{opacity:1;}
.d-cover-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to bottom, transparent 30%, var(--surface) 100%);
}
.d-cover-ph{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-d);font-size:4rem;color:var(--border2);
  letter-spacing:.1em;
}
.b-info{flex:1;min-width:0;}
.b-name{
  font-weight:500;font-size:.9rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  letter-spacing:.01em;
}
.band-row.selected .b-name{color:var(--accent);}
.b-meta{
  font-family:var(--font-m);font-size:.54rem;
  color:var(--muted);letter-spacing:.04em;margin-top:2px;
}
.b-right{display:flex;align-items:center;gap:.4rem;flex-shrink:0;}
.gtag{
  font-family:var(--font-m);font-size:.48rem;
  letter-spacing:.06em;text-transform:uppercase;
  padding:.1rem .4rem;
  border:1px solid var(--border2);color:var(--muted);
  white-space:nowrap;
}
.cbadge{
  font-family:var(--font-d);font-size:.75rem;
  padding:.05rem .4rem;
  background:rgba(180,50,50,.12);
  border:1px solid rgba(180,50,50,.25);
  color:var(--red2);
  white-space:nowrap;flex-shrink:0;
  letter-spacing:.04em;
}

/* ── DETAIL PANEL ── */
.detail-panel{
  overflow-y:auto;overflow-x:hidden;
  background:var(--surface);
  scrollbar-width:thin;scrollbar-color:var(--border2) transparent;
  display:flex;flex-direction:column;
}
.empty-state{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;height:100%;
  color:var(--muted);text-align:center;padding:2rem;
  gap:1rem;
}
.empty-icon{
  font-family:var(--font-d);font-size:5rem;
  color:transparent;-webkit-text-stroke:1px var(--border2);
  line-height:1;
}
.empty-state p{
  font-family:var(--font-m);font-size:.58rem;
  letter-spacing:.12em;text-transform:uppercase;
  line-height:2.2;color:var(--muted);
}

/* detail card */
.dc{display:none;}
.dc.vis{display:block;}

.dh{
  padding:1.5rem 1.5rem 1.2rem;
  border-bottom:1px solid var(--border2);
  position:relative;
  overflow:hidden;
}
.dh::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--red) 0%,var(--accent) 60%,transparent 100%);
}
.dh-bg{
  position:absolute;right:-1rem;top:50%;transform:translateY(-50%);
  font-family:var(--font-d);font-size:5.5rem;
  color:transparent;-webkit-text-stroke:1px var(--border);
  white-space:nowrap;pointer-events:none;line-height:1;
  max-width:60%;overflow:hidden;letter-spacing:.04em;
  opacity:.5;
}
.dg-tag{
  font-family:var(--font-m);font-size:.52rem;
  letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin-bottom:.5rem;
  display:flex;align-items:center;gap:.5rem;
}
.dg-tag::before{content:'';display:inline-block;width:16px;height:1px;background:var(--accent);}
.d-name{
  font-family:var(--font-d);font-size:2.4rem;
  letter-spacing:.04em;line-height:1;
  margin-bottom:.4rem;color:#fff;
  position:relative;
}
.d-years{
  font-family:var(--font-m);font-size:.58rem;
  color:var(--muted);letter-spacing:.09em;
  display:flex;align-items:center;gap:.5rem;
}
.d-years .span-dot{color:var(--red);}
.d-origin{
  font-family:var(--font-m);font-size:.54rem;
  color:var(--muted);margin-top:.25rem;letter-spacing:.04em;
}

/* sections */
.ds{padding:1.1rem 1.5rem;border-bottom:1px solid var(--border);}
.ds-label{
  font-family:var(--font-m);font-size:.5rem;
  letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);margin-bottom:.75rem;
  display:flex;align-items:center;gap:.5rem;
}
.ds-label::after{content:'';flex:1;height:1px;background:var(--border2);}
.d-bio{
  font-size:.8rem;line-height:1.85;
  color:var(--text2);font-weight:300;
}

/* songs */
.songs-list{display:flex;flex-direction:column;}
.si{
  display:flex;align-items:center;gap:.6rem;
  font-family:var(--font-m);font-size:.62rem;
  padding:.45rem 0;border-bottom:1px solid var(--border);
  transition:background .1s;
}
.si:last-child{border-bottom:none;}
.sn{color:var(--muted);width:1rem;text-align:right;flex-shrink:0;}
.sy{color:var(--muted);flex-shrink:0;min-width:2.4rem;}
.st{flex:1;color:var(--text);}
.spot-link{
  margin-left:auto;flex-shrink:0;
  color:var(--green);text-decoration:none;
  font-size:.5rem;
  border:1px solid rgba(58,138,85,.3);
  padding:.12rem .45rem;letter-spacing:.08em;
  transition:all .12s;text-transform:uppercase;
}
.spot-link:hover{background:rgba(58,138,85,.12);border-color:var(--green);}

/* members */
.members-list{display:flex;flex-direction:column;gap:.5rem;}
.mi{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;padding:.25rem 0;}
.mn{font-size:.82rem;font-weight:500;color:var(--text);}
.mr{font-family:var(--font-m);font-size:.55rem;color:var(--muted);text-align:right;flex-shrink:0;}

/* connections */
.conns-list{display:flex;flex-direction:column;gap:.4rem;}
.ci{
  padding:.65rem .85rem;
  border:1px solid var(--border2);
  cursor:pointer;transition:all .15s;
  background:var(--bg);
  position:relative;overflow:hidden;
}
.ci::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
  background:var(--border2);transition:background .12s;
}
.ci:hover{border-color:var(--accent);background:rgba(212,168,67,.03);}
.ci:hover::before{background:var(--accent);}
.ci-type{
  display:inline-block;
  font-family:var(--font-m);font-size:.48rem;
  letter-spacing:.08em;text-transform:uppercase;
  padding:.08rem .4rem;border:1px solid var(--border2);
  color:var(--muted);margin-bottom:.3rem;
}
.ci-type.shared-member{border-color:rgba(180,50,50,.5);color:var(--red2);}
.ci-type.shared-writer{border-color:rgba(212,168,67,.5);color:var(--accent);}
.ci-type.influenced{border-color:rgba(58,138,85,.5);color:var(--green);}
.ci-type.scene{border-color:rgba(58,95,160,.5);color:#6090d0;}
.ci-band{font-size:.82rem;font-weight:500;margin-bottom:.2rem;}
.ci:hover .ci-band{color:var(--accent);}
.ci-reason{font-family:var(--font-m);font-size:.55rem;color:var(--muted);line-height:1.6;}

/* ── GRAPH VIEW ── */
#view-graph{display:none;position:relative;}
#view-graph.active{display:flex;flex-direction:column;}
#graph-canvas{flex:1;width:100%;}
.graph-legend{
  position:absolute;bottom:1.2rem;left:1.2rem;
  background:rgba(8,8,8,.92);
  border:1px solid var(--border2);
  padding:.75rem 1rem;
  display:flex;flex-direction:column;gap:.4rem;
}
.gl-item{
  display:flex;align-items:center;gap:.5rem;
  font-family:var(--font-m);font-size:.52rem;
  letter-spacing:.07em;color:var(--muted);
}
.gl-line{width:20px;height:2px;flex-shrink:0;}
.graph-tooltip{
  position:absolute;
  background:var(--surface2);
  border:1px solid var(--border2);
  padding:.6rem .85rem;
  font-family:var(--font-m);font-size:.58rem;
  pointer-events:none;display:none;
  max-width:200px;line-height:1.6;z-index:100;
}
.graph-tooltip strong{
  font-family:var(--font-d);
  color:var(--accent);font-size:.9rem;
  display:block;margin-bottom:.25rem;letter-spacing:.04em;
}
.graph-controls{
  position:absolute;top:1.2rem;right:1.2rem;
  display:flex;flex-direction:column;gap:.4rem;
}
.gc-btn{
  font-family:var(--font-m);font-size:.58rem;
  padding:.35rem .75rem;
  border:1px solid var(--border2);
  background:rgba(8,8,8,.9);
  color:var(--muted);cursor:pointer;
  transition:all .12s;text-align:center;
  letter-spacing:.07em;text-transform:uppercase;
}
.gc-btn:hover{color:var(--text);border-color:var(--muted);}
.graph-info{
  position:absolute;top:1.2rem;left:1.2rem;
  background:rgba(8,8,8,.85);border:1px solid var(--border2);
  padding:.5rem .75rem;
  font-family:var(--font-m);font-size:.52rem;
  color:var(--muted);letter-spacing:.07em;line-height:1.7;
}

/* ── MOBILE SHEET ── */
.mobile-sheet{
  display:none;position:fixed;bottom:0;left:0;right:0;
  background:var(--surface);border-top:1px solid var(--border2);
  z-index:300;max-height:80vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .3s ease;
}
.mobile-sheet.open{transform:translateY(0);}
.sheet-handle{width:36px;height:3px;background:var(--border2);border-radius:99px;margin:.7rem auto .5rem;}
.sheet-close{
  position:absolute;top:.6rem;right:1rem;
  font-family:var(--font-m);font-size:.6rem;
  color:var(--muted);cursor:pointer;letter-spacing:.06em;
  background:none;border:none;padding:.2rem .5rem;
}

/* ── SCROLLBARS ── */
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);}

/* ── MOBILE RWD ── */
@media(max-width:700px){
  html,body{overflow:hidden;}
  header{padding:.6rem 1rem;height:48px;}
  h1{font-size:1.8rem;}
  .header-sub{display:none;}
  .vt-btn{padding:.28rem .7rem;font-size:.52rem;}
  .genre-bar{padding:.4rem 1rem;}
  #view-timeline.active{grid-template-columns:1fr;overflow:hidden;}
  .detail-panel{display:none;}
  .tl-scroll{border-right:none;}
  .mobile-sheet{display:block;}
  .band-row{padding:.65rem 1rem;}
  .yr-label{font-size:3rem;padding:.2rem 1rem .1rem;}
}
</style>
</head>
<body>

<header>
  <div class="header-brand">
    <h1>ROCK LINEAGE</h1>
    <div class="header-rule"></div>
    <div class="header-sub">
      英美搖滾脈絡圖<br>
      1955 – 1994 · 必聽樂團 · 脈絡關係
    </div>
  </div>
  <div class="view-toggle">
    <button class="vt-btn active" data-view="timeline">時間軸</button>
    <button class="vt-btn" data-view="graph">關係圖</button>
  </div>
</header>

<div class="genre-bar" id="genreBar">
  <span class="genre-label">流派</span>
  <button class="gp active" data-genre="all">全部</button>
  <button class="gp" data-genre="Rock and Roll">Rock & Roll</button>
  <button class="gp" data-genre="British Invasion">British Invasion</button>
  <button class="gp" data-genre="Folk Rock">Folk Rock</button>
  <button class="gp" data-genre="Country Rock">Country Rock</button>
  <button class="gp" data-genre="Hard Rock">Hard Rock</button>
  <button class="gp" data-genre="Heavy Metal">Heavy Metal</button>
  <button class="gp" data-genre="Progressive Rock">Prog Rock</button>
  <button class="gp" data-genre="Glam Rock">Glam Rock</button>
  <button class="gp" data-genre="Punk">Punk</button>
  <button class="gp" data-genre="New Wave">New Wave</button>
  <button class="gp" data-genre="Alternative">Alternative</button>
  <button class="gp" data-genre="Psychedelic">Psychedelic</button>
</div>

<!-- TIMELINE VIEW -->
<div class="view" id="view-timeline">
  <div class="tl-scroll" id="timeline"></div>
  <div class="detail-panel" id="detailPanel">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">▶</div>
      <p>點選左側任一樂團<br>展開完整脈絡</p>
    </div>
    <div class="dc" id="detailContent"></div>
  </div>
</div>

<!-- GRAPH VIEW -->
<div class="view" id="view-graph">
  <svg id="graph-canvas"></svg>
  <div class="graph-info">拖拉移動 · 滾輪縮放 · 點選樂團查看詳情</div>
  <div class="graph-controls">
    <button class="gc-btn" id="gc-reset">重置視圖</button>
    <button class="gc-btn" id="gc-fit">重新布局</button>
  </div>
  <div class="graph-legend">
    <div class="gl-item"><div class="gl-line" style="background:var(--red2)"></div>共同成員</div>
    <div class="gl-item"><div class="gl-line" style="background:var(--accent)"></div>共同詞曲</div>
    <div class="gl-item"><div class="gl-line" style="background:var(--green)"></div>影響關係</div>
    <div class="gl-item"><div class="gl-line" style="background:#6090d0"></div>同一場景</div>
  </div>
  <div class="graph-tooltip" id="graphTooltip"></div>
</div>

<!-- MOBILE BOTTOM SHEET -->
<div class="mobile-sheet" id="mobileSheet">
  <div class="sheet-handle"></div>
  <button class="sheet-close" id="sheetClose">✕ 關閉</button>
  <div id="sheetContent"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
// ═══════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════

async function loadImg(img, bandId) {
  if (imgCache[bandId] === null) return;
  if (imgCache[bandId]) {
    img.src = imgCache[bandId];
    img.onload = () => img.classList.add('loaded');
    return;
  }
  const title = wikiTitles[bandId];
  if (!title) return;
  try {
    const url = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`;
    const res = await fetch(url);
    const data = await res.json();
    const thumb = data?.thumbnail?.source || data?.originalimage?.source;
    if (thumb) {
      imgCache[bandId] = thumb;
      img.src = thumb;
      img.onload = () => img.classList.add('loaded');
      img.onerror = () => { img.style.display='none'; };
    } else {
      imgCache[bandId] = null;
    }
  } catch(e) {
    imgCache[bandId] = null;
  }
}

function spotifyUrl(q) {
  return `https://open.spotify.com/search/${encodeURIComponent(q.replace(/\+/g,' '))}`;
}
function buildTimeline() {
  const tl = document.getElementById('timeline');
  tl.innerHTML = '';
  const filtered = activeGenre === 'all' ? bands : bands.filter(b => b.genre === activeGenre);
  const decades = [{l:'1950s',s:1950,e:1959},{l:'1960s',s:1960,e:1969},{l:'1970s',s:1970,e:1979},{l:'1980s',s:1980,e:1989},{l:'1990s',s:1990,e:1999}];
  let globalIdx = 0;
  decades.forEach(dec => {
    const inDec = filtered.filter(b => b.formed >= dec.s && b.formed <= dec.e);
    if (!inDec.length) return;
    const g = document.createElement('div');
    g.className = 'decade-block';
    const lbl = document.createElement('div');
    lbl.className = 'yr-label';
    lbl.innerHTML = `<span class="yr-label-inner">${dec.l}</span><span class="yr-label-count">${inDec.length} 個樂團</span>`;
    g.appendChild(lbl);
    inDec.sort((a,b) => a.formed - b.formed).forEach(band => {
      globalIdx++;
      const row = document.createElement('div');
      row.className = 'band-row' + (activeBand?.id === band.id ? ' selected' : '');
      const initials = band.name.replace(/^The\s+/i,'').split(' ').map(w=>w[0]).slice(0,2).join('');
      row.innerHTML = `
        <div class="b-num">${String(globalIdx).padStart(2,'0')}</div>
        <div class="b-thumb">
          <div class="b-thumb-ph">${initials}</div>
          <img alt="${band.name}" loading="lazy">
        </div>
        <div class="b-info">
          <div class="b-name">${band.name}</div>
          <div class="b-meta">${band.formed}${band.disbanded ? '–'+band.disbanded:'–今'} &nbsp;·&nbsp; ${band.origin}</div>
        </div>
        <div class="b-right">
          <div class="gtag">${band.genre.replace('Progressive Rock','Prog').replace('British Invasion','Brit Inv.').replace('Alternative','Alt.')}</div>
          ${band.connections.length ? `<div class="cbadge">${band.connections.length}</div>` : ''}
        </div>`;
      // lazy load thumbnail
      const thumbImg = row.querySelector('.b-thumb img');
      loadImg(thumbImg, band.id);
      row.addEventListener('click', () => selectBand(band));
      g.appendChild(row);
    });
    tl.appendChild(g);
  });
}

function selectBand(band) {
  activeBand = band;
  buildTimeline();
  renderDetail(band);
  if (window.innerWidth <= 700) {
    document.getElementById('sheetContent').innerHTML = detailHTML(band);
    document.getElementById('mobileSheet').classList.add('open');
    bindDetailEvents(document.getElementById('sheetContent'));
  }
}

const typeLabel = {'shared-member':'共同成員','shared-writer':'共同詞曲','influenced':'影響關係','scene':'同一場景'};

function detailHTML(band) {
  const connBands = band.connections.map(c => {
    const f = bands.find(b => b.id === c.id);
    return {...c, name: f ? f.name : c.id};
  });
  const nameShort = band.name.replace(/^The\s+/i,'').split(' ')[0].toUpperCase();
  return `
    <div class="d-cover" id="dcover-${band.id}">
      <div class="d-cover-ph">${nameShort}</div>
      <img alt="${band.name}" id="dcoverimg-${band.id}">
      <div class="d-cover-overlay"></div>
    </div>
    <div class="dh">
      <div class="dh-bg">${nameShort}</div>
      <div class="dg-tag">${band.genre}</div>
      <div class="d-name">${band.name}</div>
      <div class="d-years">
        ${band.formed}
        <span class="span-dot">—</span>
        ${band.disbanded || '至今'}
      </div>
      <div class="d-origin">${band.origin}</div>
    </div>
    <div class="ds">
      <div class="ds-label">脈絡</div>
      <p class="d-bio">${band.bio}</p>
    </div>
    <div class="ds">
      <div class="ds-label">核心成員</div>
      <div class="members-list">
        ${band.members.map(m=>`<div class="mi"><span class="mn">${m.name}</span><span class="mr">${m.role}</span></div>`).join('')}
      </div>
    </div>
    <div class="ds">
      <div class="ds-label">必聽代表作</div>
      <div class="songs-list">
        ${band.songs.map((s,i)=>`
          <div class="si">
            <span class="sn">${i+1}</span>
            <span class="sy">${s.y}</span>
            <span class="st">${s.t}</span>
            <a class="spot-link" href="${spotifyUrl(s.sp)}" target="_blank" rel="noopener">▶ Spotify</a>
          </div>`).join('')}
      </div>
    </div>
    ${connBands.length ? `
    <div class="ds">
      <div class="ds-label">關聯樂團 · ${connBands.length} 條</div>
      <div class="conns-list">
        ${connBands.map(c=>`
          <div class="ci" data-id="${c.id}">
            <div class="ci-type ${c.type}">${typeLabel[c.type]||c.type}</div>
            <div class="ci-band">${c.name}</div>
            <div class="ci-reason">${c.reason}</div>
          </div>`).join('')}
      </div>
    </div>` : ''}`;
}

function bindDetailEvents(container) {
  container.querySelectorAll('.ci').forEach(el => {
    el.addEventListener('click', () => {
      const t = bands.find(b => b.id === el.dataset.id);
      if (t) selectBand(t);
    });
  });
}

function renderDetail(band) {
  document.getElementById('emptyState').style.display = 'none';
  const dc = document.getElementById('detailContent');
  dc.classList.add('vis');
  dc.innerHTML = detailHTML(band);
  bindDetailEvents(dc);
  document.getElementById('detailPanel').scrollTop = 0;
  // load cover image
  const coverImg = document.getElementById(`dcoverimg-${band.id}`);
  if (coverImg) loadImg(coverImg, band.id);
}

// GRAPH VIEW
// ═══════════════════════════════════════════════
const edgeColor = {'shared-member':'#d44040','shared-writer':'#d4a843','influenced':'#3a8a55','scene':'#4070b0'};
let simulation, svg_g, zoom_behavior;

function buildGraph() {
  const svgEl = document.getElementById('graph-canvas');
  svgEl.innerHTML = '';
  const W = svgEl.clientWidth || svgEl.parentElement.clientWidth;
  const H = svgEl.clientHeight || svgEl.parentElement.clientHeight;

  const filtered = activeGenre === 'all' ? bands : bands.filter(b => b.genre === activeGenre);
  const filteredIds = new Set(filtered.map(b => b.id));

  const nodes = filtered.map(b => ({id:b.id, name:b.name, genre:b.genre, formed:b.formed}));
  const links = [];
  filtered.forEach(b => {
    b.connections.forEach(c => {
      if (filteredIds.has(c.id)) links.push({source:b.id, target:c.id, type:c.type});
    });
  });
  const seen = new Set();
  const dedupLinks = links.filter(l => {
    const k = [l.source,l.target].sort().join('|') + '|' + l.type;
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });

  const genreColors = {
    'Rock and Roll':'#d4a843','British Invasion':'#4070c0','Folk Rock':'#3a8a55',
    'Country Rock':'#9060a0','Hard Rock':'#c44040','Heavy Metal':'#666',
    'Progressive Rock':'#4090b0','Glam Rock':'#c060b0','Punk':'#c06030',
    'New Wave':'#50a080','Alternative':'#8080a0','Psychedelic':'#80b030'
  };

  const svgD3 = d3.select(svgEl).attr('width',W).attr('height',H);

  zoom_behavior = d3.zoom().scaleExtent([0.15,4])
    .on('zoom', e => svg_g.attr('transform', e.transform));
  svgD3.call(zoom_behavior);
  svg_g = svgD3.append('g');

  simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(dedupLinks).id(d=>d.id).distance(130).strength(0.4))
    .force('charge', d3.forceManyBody().strength(-300))
    .force('center', d3.forceCenter(W/2, H/2))
    .force('collision', d3.forceCollide(42));

  const link = svg_g.append('g').selectAll('line')
    .data(dedupLinks).join('line')
    .attr('stroke', d => edgeColor[d.type] || '#333')
    .attr('stroke-width', d => d.type === 'shared-member' ? 2.5 : d.type === 'shared-writer' ? 2 : 1.2)
    .attr('stroke-opacity', d => d.type === 'scene' ? 0.3 : 0.6)
    .attr('stroke-dasharray', d => d.type === 'scene' ? '5 3' : d.type === 'influenced' ? '2 2' : null);

  const node = svg_g.append('g').selectAll('g')
    .data(nodes).join('g')
    .attr('cursor','pointer')
    .call(d3.drag()
      .on('start', (e,d) => { if(!e.active) simulation.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
      .on('drag', (e,d) => { d.fx=e.x; d.fy=e.y; })
      .on('end', (e,d) => { if(!e.active) simulation.alphaTarget(0); d.fx=null; d.fy=null; }))
    .on('click', (e,d) => {
      const b = bands.find(x => x.id === d.id);
      if (b) { activeBand = b; buildTimeline(); renderDetail(b); }
    })
    .on('mouseover', (e,d) => {
      const tt = document.getElementById('graphTooltip');
      tt.style.display = 'block';
      tt.innerHTML = `<strong>${d.name}</strong>${d.genre} · ${d.formed}`;
      tt.style.left = (e.offsetX + 14) + 'px';
      tt.style.top = (e.offsetY - 10) + 'px';
    })
    .on('mousemove', e => {
      const tt = document.getElementById('graphTooltip');
      tt.style.left = (e.offsetX + 14) + 'px';
      tt.style.top = (e.offsetY - 10) + 'px';
    })
    .on('mouseout', () => { document.getElementById('graphTooltip').style.display = 'none'; });

  // outer ring
  node.append('circle').attr('r',20)
    .attr('fill', d => genreColors[d.genre] || '#555')
    .attr('fill-opacity', 0.1)
    .attr('stroke', d => genreColors[d.genre] || '#555')
    .attr('stroke-width', 1)
    .attr('stroke-opacity', 0.4);

  // inner dot
  node.append('circle').attr('r',5)
    .attr('fill', d => genreColors[d.genre] || '#555')
    .attr('fill-opacity', 0.8);

  node.append('text')
    .text(d => d.name.replace(/^The\s+/i,'').split(/\s+/).slice(0,2).join(' '))
    .attr('text-anchor','middle')
    .attr('dy', 34)
    .attr('font-family','IBM Plex Mono, monospace')
    .attr('font-size', '8px')
    .attr('fill', '#888')
    .attr('pointer-events','none');

  simulation.on('tick', () => {
    link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
        .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    node.attr('transform', d=>`translate(${d.x},${d.y})`);
  });
}

document.getElementById('gc-reset').addEventListener('click', () => {
  const svgEl = document.getElementById('graph-canvas');
  const W = svgEl.clientWidth, H = svgEl.clientHeight;
  d3.select(svgEl).transition().duration(500)
    .call(zoom_behavior.transform, d3.zoomIdentity.translate(0,0).scale(1));
});
document.getElementById('gc-fit').addEventListener('click', () => {
  if (simulation) simulation.alpha(0.6).restart();
});

// ═══════════════════════════════════════════════
// VIEW TOGGLE
// ═══════════════════════════════════════════════
document.querySelectorAll('.vt-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.vt-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeView = btn.dataset.view;
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + activeView).classList.add('active');
    if (activeView === 'graph') setTimeout(buildGraph, 50);
  });
});

// ═══════════════════════════════════════════════
// GENRE FILTER
// ═══════════════════════════════════════════════
document.getElementById('genreBar').addEventListener('click', e => {
  const p = e.target.closest('.gp');
  if (!p) return;
  document.querySelectorAll('.gp').forEach(x => x.classList.remove('active'));
  p.classList.add('active');
  activeGenre = p.dataset.genre;
  activeBand = null;
  document.getElementById('emptyState').style.display = '';
  document.getElementById('detailContent').classList.remove('vis');
  buildTimeline();
  if (activeView === 'graph') buildGraph();
});

// ═══════════════════════════════════════════════
// MOBILE
// ═══════════════════════════════════════════════
document.getElementById('sheetClose').addEventListener('click', () => {
  document.getElementById('mobileSheet').classList.remove('open');
});

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
document.getElementById('view-timeline').classList.add('active');
buildTimeline();
</script>
</body>
</html>
